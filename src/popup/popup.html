<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>酒店降价追踪</title><link rel="stylesheet" href="popup.css"></head><body>
<h1>酒店降价追踪</h1><p>在 Booking 酒店页面选择日期与币种，点击「加入追踪」。</p>
<p id="quota"></p><button id="check">检查降价（全部）</button><p id="status" role="status"></p><main id="list"></main>
<p class="notice">请自行核对取消政策与价格条款，本插件不代下单。不同房型、税费、餐食及每晚/总价可能不可比。</p>
<details><summary>本地解锁</summary><p>小红书私信『珊哥爱读书』获取解锁码</p><input id="license" aria-label="解锁码" placeholder="输入解锁码"><button id="unlock">解锁</button></details>
<script src="popup.js"></script></body></html>
